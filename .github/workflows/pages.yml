name: Publicar PWA en GitHub Pages

# Descarga la build web publicada de pdfcraft, le anade manifest, iconos y service worker
# (instalable y offline) y la publica en GitHub Pages.
on:
  push:
    branches: [main]
    paths: [".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PDFCRAFT_VERSION: "0.22.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar y verificar la build web
        run: |
          set -euo pipefail
          base="https://github.com/storytold/pdfcraft/releases/download/v${PDFCRAFT_VERSION}"
          curl -fsSL -o web.zip "$base/pdfcraft-web-${PDFCRAFT_VERSION}.zip"
          curl -fsSL -o SHA256SUMS.txt "$base/SHA256SUMS.txt"
          expected=$(grep " pdfcraft-web-${PDFCRAFT_VERSION}.zip$" SHA256SUMS.txt | awk '{print $1}')
          echo "$expected  web.zip" | sha256sum -c -
          unzip -q web.zip
          mv "pdfcraft-web-${PDFCRAFT_VERSION}" site

      - name: Anadir la capa PWA
        run: |
          cat > make_pwa.py <<'PYEOF'
          #!/usr/bin/env python3
          """Add PWA files (manifest, icons, service worker) to an unpacked pdfcraft-web site."""
          import hashlib, json, os, re, struct, sys, zlib

          site = sys.argv[1]

          def png(size, maskable=False):
              bg, fg, accent = (0x1f, 0x4f, 0xd8), (255, 255, 255), (0xd8, 0x2f, 0x2f)
              pad = 0.22 if maskable else 0.0
              rows = []
              for y in range(size):
                  row = bytearray([0])
                  for x in range(size):
                      u, v = x / size, y / size
                      px = bg
                      # page shape
                      px0, px1, py0, py1 = 0.28, 0.72, 0.18, 0.82
                      if maskable:
                          px0, px1, py0, py1 = 0.30, 0.70, 0.24, 0.76
                      if px0 <= u <= px1 and py0 <= v <= py1:
                          px = fg
                          # folded corner
                          if u > px1 - 0.12 and v < py0 + 0.12 and (u - (px1 - 0.12)) > (py0 + 0.12 - v) * 1.0 - 0.0 and (u - (px1 - 0.12)) + (py0 + 0.12 - v) > 0.12:
                              px = bg
                          # red text bar
                          if py0 + 0.50 <= v <= py0 + 0.58 and px0 + 0.06 <= u <= px1 - 0.06:
                              px = accent
                          elif py0 + 0.30 <= v <= py0 + 0.36 and px0 + 0.06 <= u <= px1 - 0.18:
                              px = (0x99, 0xa8, 0xd0)
                      row += bytes(px)
                  rows.append(bytes(row))
              raw = b"".join(rows)
              def chunk(t, d):
                  c = struct.pack(">I", len(d)) + t + d
                  return c + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              return (b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 2, 0, 0, 0))
                      + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b""))

          os.makedirs(os.path.join(site, "icons"), exist_ok=True)
          for name, size, m in [("icon-192.png", 192, False), ("icon-512.png", 512, False),
                                ("icon-maskable-512.png", 512, True), ("apple-touch-icon.png", 180, False)]:
              with open(os.path.join(site, "icons", name), "wb") as f:
                  f.write(png(size, m))

          manifest = {
              "name": "PdfCraft", "short_name": "PdfCraft",
              "description": "Editor y visor de PDF que funciona en local, en el navegador.",
              "start_url": "./", "scope": "./", "display": "standalone",
              "background_color": "#f1f1f3", "theme_color": "#1f4fd8", "lang": "es",
              "icons": [
                  {"src": "icons/icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any"},
                  {"src": "icons/icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any"},
                  {"src": "icons/icon-maskable-512.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable"},
              ],
          }
          with open(os.path.join(site, "manifest.webmanifest"), "w") as f:
              json.dump(manifest, f, indent=2)

          # Files to precache: everything except models, licences and docs (models are cached when first used).
          core = []
          for root, _, files in os.walk(site):
              for fn in files:
                  p = os.path.relpath(os.path.join(root, fn), site).replace(os.sep, "/")
                  if p.startswith(("models/", "licenses/")) or p in ("sw.js", "HOSTING.md", "README.md", "_headers", ".htaccess"):
                      continue
                  if p.endswith((".md", ".txt")) or p.startswith("LICENSE") or p == "NOTICE":
                      continue
                  if p.startswith("pdfcraft-ocr-worker"):
                      continue  # el worker OCR se cachea la primera vez que se usa OCR
                  core.append(p)
          core.sort()
          h = hashlib.sha256()
          for p in core:
              h.update(p.encode())
              with open(os.path.join(site, p), "rb") as f:
                  h.update(f.read())
          version = h.hexdigest()[:12]
          precache = ["./"] + [p for p in core if p != "index.html"] + ["index.html"]
          total_bytes = sum(os.path.getsize(os.path.join(site, p)) for p in core)

          sw = """// Service worker generado en cada build. Version: %(v)s
          const CACHE = 'pdfcraft-%(v)s';
          const PRECACHE = %(list)s;

          const TOTAL = %(total)d;

          async function notify(loaded, done) {
            const cl = await self.clients.matchAll({ includeUncontrolled: true });
            cl.forEach((c) => c.postMessage({ type: 'pwa-progress', loaded, total: TOTAL, done: !!done }));
          }

          async function precache() {
            const cache = await caches.open(CACHE);
            let loaded = 0, last = 0;
            const queue = PRECACHE.slice();
            async function worker() {
              while (queue.length) {
                const url = queue.shift();
                const res = await fetch(url);
                if (!res.ok) throw new Error('precache ' + url + ' ' + res.status);
                const reader = res.clone().body.getReader();
                const put = cache.put(url, res);
                for (;;) {
                  const r = await reader.read();
                  if (r.done) break;
                  loaded += r.value.length;
                  const now = Date.now();
                  if (now - last > 250) { last = now; notify(loaded, false); }
                }
                await put;
              }
            }
            await Promise.all([worker(), worker(), worker()]);
            await notify(TOTAL, true);
          }

          self.addEventListener('install', (event) => {
            event.waitUntil(precache().then(() => self.skipWaiting()));
          });

          self.addEventListener('activate', (event) => {
            event.waitUntil(
              caches.keys().then((keys) => Promise.all(keys.filter((k) => k.startsWith('pdfcraft-') && k !== CACHE).map((k) => caches.delete(k))))
                .then(() => self.clients.claim())
            );
          });

          self.addEventListener('fetch', (event) => {
            const req = event.request;
            if (req.method !== 'GET') return;
            const url = new URL(req.url);
            if (url.origin !== location.origin) return;
            const isModel = url.pathname.includes('/models/');
            const isPage = req.mode === 'navigate' || url.pathname.endsWith('/') || url.pathname.endsWith('/index.html');
            if (isPage || isModel) {
              // Red primero (la pagina y los modelos no llevan hash), cache si no hay conexion.
              event.respondWith(
                fetch(req).then((res) => {
                  if (res && res.ok) { const copy = res.clone(); caches.open(CACHE).then((c) => c.put(req, copy)); }
                  return res;
                }).catch(() => caches.match(req, { ignoreSearch: true }).then((r) => r || caches.match('./')))
              );
              return;
            }
            // Archivos con hash: cache primero.
            event.respondWith(
              caches.match(req).then((hit) => hit || fetch(req).then((res) => {
                if (res && res.ok) { const copy = res.clone(); caches.open(CACHE).then((c) => c.put(req, copy)); }
                return res;
              }))
            );
          });
          """ % {"v": version, "list": json.dumps(precache, indent=2), "total": total_bytes}
          with open(os.path.join(site, "sw.js"), "w") as f:
              f.write(sw)

          idx = os.path.join(site, "index.html")
          html = open(idx, encoding="utf-8").read()
          head = """    <link rel="manifest" href="./manifest.webmanifest" />
              <meta name="theme-color" content="#1f4fd8" />
              <meta name="mobile-web-app-capable" content="yes" />
              <meta name="apple-mobile-web-app-capable" content="yes" />
              <meta name="apple-mobile-web-app-title" content="PdfCraft" />
              <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
              <link rel="icon" type="image/png" href="./icons/icon-192.png" />
              <style>
                #pwa-progress{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:2147483647;max-width:92vw;
                  background:#1f2430;color:#fff;font:14px/1.35 system-ui,sans-serif;padding:10px 14px;border-radius:10px;
                  box-shadow:0 4px 18px rgba(0,0,0,.3);display:none}
                #pwa-progress .bar{height:4px;background:#ffffff33;border-radius:2px;margin-top:6px;overflow:hidden}
                #pwa-progress .bar i{display:block;height:100%;width:0;background:#6ea0ff}
              </style>
              <script>
                if ('serviceWorker' in navigator) {
                  const mk = () => {
                    let el = document.getElementById('pwa-progress');
                    if (!el) {
                      el = document.createElement('div'); el.id = 'pwa-progress';
                      el.innerHTML = '<div class="t"></div><div class="bar"><i></i></div>';
                      document.body.appendChild(el);
                    }
                    return el;
                  };
                  let hideT;
                  navigator.serviceWorker.addEventListener('message', (e) => {
                    const d = e.data; if (!d || d.type !== 'pwa-progress') return;
                    if (!document.body) return;
                    const el = mk();
                    clearTimeout(hideT);
                    if (d.done) {
                      el.querySelector('.t').textContent = 'Listo. PdfCraft ya funciona sin conexi\u00f3n.';
                      el.querySelector('i').style.width = '100%';
                      hideT = setTimeout(() => { el.style.display = 'none'; }, 3000);
                    } else {
                      const mb = (n) => (n / 1048576).toFixed(0);
                      el.querySelector('.t').textContent = 'Descargando PdfCraft para usarlo sin conexi\u00f3n: ' + mb(d.loaded) + ' de ' + mb(d.total) + ' MB (solo la primera vez)';
                      el.querySelector('i').style.width = Math.min(100, d.loaded * 100 / d.total) + '%';
                      hideT = setTimeout(() => { el.style.display = 'none'; }, 20000);
                    }
                    el.style.display = 'block';
                  });
                  navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('sw', e));
                }
              </script>
          """
          assert "</head>" in html
          html = html.replace("</head>", head + "  </head>", 1)
          open(idx, "w", encoding="utf-8").write(html)
          print("pwa ok, version", version, "precache", len(precache))
          PYEOF
          python3 make_pwa.py site
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
