<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>PdfCraft</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <!-- Recognises text off the page's thread (crates/ui-egui/src/workflows/ocr_web.rs). -->
    <link data-trunk rel="rust" href="../pdfcraft-ocr-worker/Cargo.toml" data-type="worker" data-loader-shim data-bindgen-target="web" data-wasm-opt="3" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        background: #f1f1f3;
      }
      body {
        box-sizing: border-box;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      @media (prefers-color-scheme: dark) { html, body { background: #19191c; } }
    </style>
  </head>
  <body>
    <canvas id="pdfcraft"></canvas>
  </body>
</html>
